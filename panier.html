<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon panier - Fatou Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>🛒 Mon panier</h1>

<div id="contenu-panier"></div>
<div id="total-panier"></div>

<h2 id="total"></h2>

<div class="formulaire-commande">

    <h2>Informations de livraison</h2>

    <input type="text" id="nom" placeholder="Votre nom">

    <input type="text" id="ville" placeholder="Votre ville">

    <input type="text" id="quartier" placeholder="Votre quartier">

    <input type="tel" id="telephone" placeholder="Votre numéro de téléphone">

    <button id="valider">
        🟢 Commander sur WhatsApp
    </button>

</div>

<script src="js/panier.js"></script>

</body>
</html>
